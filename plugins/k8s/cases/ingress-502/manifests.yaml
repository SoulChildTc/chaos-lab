apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: PLACEHOLDER
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: PLACEHOLDER
spec:
  selector:
    app: web
  ports:
    # BUG: the backend listens on 80, this says 8080. The Service still gets
    # endpoints, so nothing looks obviously wrong until traffic arrives.
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: PLACEHOLDER
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: gateway-conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-conf
  namespace: PLACEHOLDER
data:
  default.conf: |
    server {
      listen 80;
      location / {
        proxy_pass http://web.PLACEHOLDER.svc.cluster.local;
      }
    }
