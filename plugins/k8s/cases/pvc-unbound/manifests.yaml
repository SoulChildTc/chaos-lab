apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: PLACEHOLDER
spec:
  # BUG: kind's default storage class is "standard". This name does not exist, so
  # no provisioner answers and the PVC stays Pending with no pods involved.
  storageClassName: fast-ssd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: PLACEHOLDER
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: lab
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
